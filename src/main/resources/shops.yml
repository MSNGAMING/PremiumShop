# PremiumShop - Shop Definitions
# --------------------------------
# Structure:
#   shops:
#     <shop-id>:
#       display-name: <string>
#       description: <string>
#       icon: <material>
#       categories:
#         <category-id>:
#           display-name: <string>
#           description: <string>
#           icon: <material>
#           slot: <int>  (slot in the main shop category selector GUI)
#           gui-layout:
#             title: <string>
#             rows: <int>
#             slots: [<int>, ...]  # ordered list of slots where shop items appear
#           items:
#             <item-id>:
#               material: <material>
#               display-name: <string>
#               lore: [<string>, ...]
#               base-buy-price: <double>
#               base-sell-price: <double>
#               max-stock: <int>
#               current-stock: <int>

