        icon: ENDER_PEARL
        slot: 14
        items: {}

      tools_combat:
        display-name: "&6&lTools & Combat"
        icon: NETHERITE_SWORD
        slot: 15
        items: {}

      redstone_tech:
        display-name: "&4&lRedstone & Tech"
        icon: REDSTONE
        slot: 20
        items: {}

      brewing_alchemy:
