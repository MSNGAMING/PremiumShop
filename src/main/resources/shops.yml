# PremiumShop - Shop Definitions
# --------------------------------
# PremiumShop auto-generates all survival-obtainable items across these 10 categories
# on first launch, or when /shopadmin generatecatalog is executed.
#
# Stocks operate as limited background reserves (tracked dynamically behind the scenes),
# and remain completely invisible to players in GUIs.

shops:
  main:
    display-name: "&6&lPremium Shop"
    description: "The main server survival shop."
    icon: CHEST
    categories:
      building_blocks:
        display-name: "&a&lBuilding Blocks"
        icon: BRICKS
        slot: 11
        items: {}

      minerals_ores:
        display-name: "&b&lMinerals & Ores"
        icon: DIAMOND
        slot: 12
        items: {}

      farming_food:
